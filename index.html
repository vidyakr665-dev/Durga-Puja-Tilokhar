<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>श्री श्री दुर्गा पूजा महोत्सव — तिलोखर</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>

<body>

<header class="site-header">

  <div class="brand">
    श्री श्री दुर्गा पूजा महोत्सव
  </div>

  <nav>
    <a href="#home">मुख्य पृष्ठ</a>
    <a href="#donate">चंदा सहयोग</a>
    <a href="#ledger">आय-व्यय</a>
    <a href="#contact">संपर्क करें</a>
  </nav>

  <div class="jai">
    ॥ जय माता दी ॥
  </div>

</header>


<main>

  <!-- ================= POSTER SLIDER ================= -->

  <section id="home" class="hero">

    <div class="slides">

      <!-- Poster 1 -->
      <img
        class="slide active"
        src="poster-1-puja.jpg"
        alt="श्री श्री दुर्गा पूजा महोत्सव">

      <!-- Poster 2 -->
      <img
        class="slide"
        src="poster-2-adhikarigan.jpg"
        alt="अधिकारी गण">

      <!-- Poster 3 -->
      <img
        class="slide"
        src="poster-3-donation.jpg"
        alt="दुर्गा पूजा सहयोग">

    </div>

    <button
      class="slider-btn prev"
      aria-label="पिछला पोस्टर">
      ❮
    </button>

    <button
      class="slider-btn next"
      aria-label="अगला पोस्टर">
      ❯
    </button>

    <div
      class="dots"
      aria-label="पोस्टर नेविगेशन">
    </div>

  </section>


  <!-- ================= ONLINE DONATION ================= -->

  <section id="donate" class="section">

    <div class="section-title">

      <span>🙏</span>

      <h2>
        ऑनलाइन सहयोग राशि
      </h2>

      <span>🙏</span>

    </div>


    <div class="donate-grid">

      <div class="card donation-card">

        <h3>
          चंदा / सहयोग दें
        </h3>

        <p class="muted">
          भुगतान सफल होने के बाद रसीद संख्या
          अपने-आप बनेगी और रसीद स्क्रीन पर दिखाई जाएगी।
        </p>


        <form id="donationForm">

          <label>
            नाम *

            <input
              id="donorName"
              required
              maxlength="80"
              placeholder="आपका नाम">
          </label>


          <label>
            मोबाइल *

            <input
              id="donorMobile"
              required
              inputmode="numeric"
              pattern="[0-9]{10}"
              maxlength="10"
              placeholder="10 अंकों का मोबाइल">
          </label>


          <label>
            ईमेल (वैकल्पिक)

            <input
              id="donorEmail"
              type="email"
              maxlength="120"
              placeholder="receipt@example.com">
          </label>


          <label>
            राशि (₹) *

            <input
              id="amount"
              required
              type="number"
              min="1"
              max="200000"
              step="1"
              placeholder="जैसे 501">
          </label>


          <label>
            नोट (वैकल्पिक)

            <textarea
              id="note"
              maxlength="250"
              placeholder="कोई संदेश">
            </textarea>

          </label>


          <button
            class="primary"
            type="submit">

            ₹ अभी सहयोग करें

          </button>


          <p
            id="payStatus
