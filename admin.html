<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | आय-व्यय</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><div class="brand"><div class="brand-mark">ॐ</div><div><h1>समिति Admin Panel</h1><p>छात्र नवयुवक संघ • तिलोखर (रोहतास)</p></div></div><a class="jai" href="index.html">वेबसाइट</a></header><main class="section"><div class="section-title"><h2>खर्च जोड़ें</h2><p>केवल अधिकृत समिति admin ही यहाँ खर्च दर्ज करे।</p></div><div class="donation-card" style="max-width:700px;margin:auto"><form id="loginForm"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button class="primary">Login</button></form><form id="expenseForm" style="display:none"><label>खर्च का विवरण<input id="desc" required></label><label>राशि (₹)<input id="amt" type="number" min="1" required></label><button class="primary">खर्च सुरक्षित करें</button><button type="button" class="secondary" id="logout">Logout</button><p id="msg"></p></form></div></main><script src="config.js"></script><script>const C=window.DURGA_CONFIG||{};const demo=!C.SUPABASE_URL||C.SUPABASE_URL.includes('YOUR_PROJECT')||C.DEMO_MODE;let db;async function init(){if(demo){document.getElementById('loginForm').innerHTML='<p>Admin backend चलाने के लिए config.js में Supabase settings भरें।</p>';return}const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';document.head.appendChild(s);await new Promise(r=>s.onload=r);db=window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_PUBLISHABLE_KEY);document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.signInWithPassword({email:email.value,password:password.value});if(error){alert(error.message);return}loginForm.style.display='none';expenseForm.style.display='grid'};expenseForm.onsubmit=async e=>{e.preventDefault();const {error}=await db.from('expenses').insert({description:desc.value,amount:Number(amt.value)});msg.textContent=error?error.message:'खर्च सुरक्षित हो गया।';if(!error)e.target.reset()};logout.onclick=()=>db.auth.signOut().then(()=>location.reload())}init();</script></body></html>
