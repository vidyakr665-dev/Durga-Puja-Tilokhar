<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>व्यवस्थापक पैनल</title><link rel="stylesheet" href="style.css"></head><body><main class="section"><div class="card"><h2>व्यवस्थापक पैनल</h2><p class="muted">यह पेज केवल समिति के अधिकृत Supabase users के लिए है।</p><form id="login"><input id="email" type="email" placeholder="Admin email" required><input id="password" type="password" placeholder="Password" required><button class="primary">Login</button></form><div id="panel" hidden><hr><h3>खर्च दर्ज करें</h3><form id="expenseForm"><input id="desc" placeholder="खर्च का विवरण" required><input id="amt" type="number" min="1" placeholder="राशि ₹" required><button class="primary">खर्च सेव करें</button></form><p id="msg"></p><button id="logout" class="secondary">Logout</button></div></div></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const C=window.DURGA_CONFIG||{};const client=(C.SUPABASE_URL&&!C.DEMO_MODE)?supabase.createClient(C.SUPABASE_URL,C.SUPABASE_PUBLISHABLE_KEY):null;
const login=document.querySelector("#login"),panel=document.querySelector("#panel");
login.onsubmit=async e=>{e.preventDefault();if(!client)return alert("पहले config.js में Supabase सेट करें।");const {error}=await client.auth.signInWithPassword({email:email.value,password:password.value});if(error)return alert(error.message);show()};
async function show(){const {data:{user}}=await client.auth.getUser();if(!user)return;login.hidden=true;panel.hidden=false}
document.querySelector("#logout").onclick=async()=>{await client.auth.signOut();location.reload()};
document.querySelector("#expenseForm").onsubmit=async e=>{e.preventDefault();const {data:{session}}=await client.auth.getSession();const r=await fetch(`${C.SUPABASE_URL}/rest/v1/expenses`,{method:"POST",headers:{"Content-Type":"application/json","apikey":C.SUPABASE_PUBLISHABLE_KEY,"Authorization":`Bearer ${session.access_token}`,"Prefer":"return=minimal"},body:JSON.stringify({description:desc.value,amount:Number(amt.value),created_by:session.user.id})});document.querySelector("#msg").textContent=r.ok?"खर्च सेव हो गया।":"खर्च सेव नहीं हुआ।";if(r.ok)e.target.reset()};
if(client)show();
</script></body></html>
