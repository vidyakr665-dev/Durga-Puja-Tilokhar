<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>दान रसीद</title><link rel="stylesheet" href="style.css"></head><body><main class="section"><div class="card receipt" id="receipt"><h1>॥ जय माता दी ॥</h1><h2>श्री श्री दुर्गा पूजा महोत्सव</h2><p>छात्र नवयुवक संघ, तिलोखर (रोहतास)</p><hr><h3>सहयोग राशि रसीद</h3><div id="receiptData">रसीद लोड हो रही है…</div><button class="primary" onclick="window.print()">रसीद प्रिंट / PDF सेव करें</button></div></main><script src="config.js"></script><script>
(async()=>{const no=new URLSearchParams(location.search).get("receipt");const box=document.querySelector("#receiptData");if(!no){box.textContent="रसीद संख्या नहीं मिली।";return}
const C=window.DURGA_CONFIG||{};if(C.DEMO_MODE||!C.SUPABASE_URL){box.innerHTML="<p>डेमो मोड में वास्तविक रसीद उपलब्ध नहीं है।</p>";return}
const r=await fetch(`${C.SUPABASE_URL}/rest/v1/public_receipts?receipt_no=eq.${encodeURIComponent(no)}&select=*&limit=1`,{headers:{apikey:C.SUPABASE_PUBLISHABLE_KEY,Authorization:`Bearer ${C.SUPABASE_PUBLISHABLE_KEY}`}});const a=await r.json();if(!a[0]){box.textContent="रसीद नहीं मिली या भुगतान अभी पुष्ट नहीं हुआ है।";return}const x=a[0];box.innerHTML=`<div class="receipt-grid"><p><b>रसीद संख्या:</b> ${x.receipt_no}</p><p><b>नाम:</b> ${x.donor_name}</p><p><b>मोबाइल:</b> ${x.mobile_masked}</p><p><b>राशि:</b> ₹${Number(x.amount).toLocaleString("en-IN")}</p><p><b>तिथि/समय:</b> ${new Date(x.paid_at).toLocaleString("hi-IN")}</p><p><b>स्थिति:</b> सफल</p></div><p>आपके सहयोग के लिए धन्यवाद।</p>`})();
</script></body></html>
