<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>दान रसीद | श्री श्री दुर्गा पूजा महोत्सव</title><link rel="stylesheet" href="style.css"><style>.receipt{max-width:800px;margin:35px auto;background:#fff;border:5px double #c99a2e;border-radius:18px;overflow:hidden;box-shadow:0 12px 40px #4b160d20}.receipt img{width:100%;display:block}.rbody{padding:28px}.rbody h1{text-align:center;color:#8f0c10}.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.rbox{padding:15px;background:#fff7e8;border:1px solid #e2c36f;border-radius:10px}.print{display:block;margin:20px auto}.center{text-align:center}.muted{color:#6d5148}@media(max-width:600px){.rgrid{grid-template-columns:1fr}}</style></head><body><div class="receipt"><img src="assets/poster-1-puja.jpg" alt="माँ दुर्गा"><div class="rbody"><h1>दान / चंदा रसीद</h1><p class="center"><b>श्री श्री दुर्गा पूजा महोत्सव</b><br>छात्र नवयुवक संघ, तिलोखर (रोहतास)</p><div id="receiptData" class="rgrid"><div class="rbox">रसीद क्रमांक<br><b>लोड हो रहा है…</b></div></div><p class="center muted">माँ दुर्गा की कृपा आप और आपके परिवार पर सदा बनी रहे।</p><button class="primary print" onclick="window.print()">🖨️ रसीद प्रिंट / PDF</button></div></div><script src="config.js"></script><script>const CFG=window.DURGA_CONFIG||{};const demo=!CFG.SUPABASE_URL||CFG.SUPABASE_URL.includes('YOUR_PROJECT')||CFG.DEMO_MODE;async function go(){const box=document.getElementById('receiptData'),r=new URLSearchParams(location.search).get('receipt');if(demo){box.innerHTML='<div class="rbox">Backend setup के बाद वास्तविक रसीद विवरण यहाँ आएगा।</div>';return}const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';document.head.appendChild(s);await new Promise(x=>s.onload=x);const db=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_PUBLISHABLE_KEY);const {data,error}=await db.from('public_receipts').select('*').eq('receipt_no',r).single();if(error||!data){box.innerHTML='<div class="rbox">रसीद नहीं मिली।</div>';return}box.innerHTML=`<div class="rbox">रसीद क्रमांक<br><b>${data.receipt_no}</b></div><div class="rbox">दाता का नाम<br><b>${data.donor_name}</b></div><div class="rbox">राशि<br><b>₹${Number(data.amount).toLocaleString('en-IN')}</b></div><div class="rbox">दिनांक व समय<br><b>${new Date(data.paid_at).toLocaleString('hi-IN')}</b></div>`}go();</script></body></html>
